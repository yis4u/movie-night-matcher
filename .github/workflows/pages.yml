name: Test and deploy GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Build, room flows, accessibility, and security rules
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      pages-artifact-name: ${{ steps.pages-artifact-name.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm ci --prefix functions
      - run: npm run check
      - run: npm test
      - name: Test Firestore access rules in emulator
        run: npm run test:rules
      - name: Build demo for browser tests
        run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Test desktop, mobile, keyboard, and two-person room flows
        run: npm run test:e2e
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results
          retention-days: 7
      - name: Build published frontend
        if: github.event_name != 'pull_request'
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_APPCHECK_SITE_KEY: ${{ vars.VITE_FIREBASE_APPCHECK_SITE_KEY }}
          VITE_FIREBASE_FUNCTIONS_REGION: ${{ vars.VITE_FIREBASE_FUNCTIONS_REGION }}
          VITE_TMDB_ENABLED: ${{ vars.VITE_TMDB_ENABLED }}
      - name: Choose a unique Pages artifact for this build attempt
        if: github.event_name != 'pull_request'
        id: pages-artifact-name
        run: echo "name=github-pages-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          name: ${{ steps.pages-artifact-name.outputs.name }}
          path: dist
  deploy:
    name: Publish frontend
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          artifact_name: ${{ needs.verify.outputs.pages-artifact-name }}
